name: visitorportal-prod

x-app-image: &app-image "${VISITORPORTAL_IMAGE:?VISITORPORTAL_IMAGE is required}"

x-app-environment: &app-environment
  APP_NAME: "${APP_NAME:-VisitorPortal}"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY:?APP_KEY is required}"
  APP_URL: "${APP_URL:?APP_URL is required}"
  APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Berlin}"
  APP_LOCALE: "${APP_LOCALE:-de}"
  APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
  LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
  AUTH_LOGIN_MAX_ATTEMPTS: "${AUTH_LOGIN_MAX_ATTEMPTS:-5}"
  AUTH_LOGIN_DECAY_SECONDS: "${AUTH_LOGIN_DECAY_SECONDS:-60}"
  AUTH_PASSWORD_RESET_MAX_ATTEMPTS: "${AUTH_PASSWORD_RESET_MAX_ATTEMPTS:-6}"
  AUTH_PASSWORD_RESET_DECAY_SECONDS: "${AUTH_PASSWORD_RESET_DECAY_SECONDS:-60}"
  AUTH_MODE: "${AUTH_MODE:-local}"
  SSO_ENABLED: "${SSO_ENABLED:-false}"
  SSO_DRIVER: "${SSO_DRIVER:-oidc}"
  OIDC_DISPLAY_NAME: "${OIDC_DISPLAY_NAME:-Company SSO}"
  OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
  OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
  OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
  OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
  OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
  OIDC_REQUIRE_VERIFIED_EMAIL: "${OIDC_REQUIRE_VERIFIED_EMAIL:-true}"
  OIDC_ALLOWED_DOMAINS: "${OIDC_ALLOWED_DOMAINS:-}"
  OIDC_PROVISIONING_MODE: "${OIDC_PROVISIONING_MODE:-disabled}"
  OIDC_SYNC_USER_PROFILE: "${OIDC_SYNC_USER_PROFILE:-true}"
  OIDC_STORE_CLAIMS: "${OIDC_STORE_CLAIMS:-false}"
  OIDC_SYNC_ROLES: "${OIDC_SYNC_ROLES:-false}"
  OIDC_SYNC_ROLES_ON_LOGIN: "${OIDC_SYNC_ROLES_ON_LOGIN:-false}"
  OIDC_SYNC_ROLES_REMOVE_UNMAPPED: "${OIDC_SYNC_ROLES_REMOVE_UNMAPPED:-false}"
  OIDC_GROUPS_CLAIM: "${OIDC_GROUPS_CLAIM:-groups}"
  OIDC_LOGOUT_MODE: "${OIDC_LOGOUT_MODE:-local}"
  OIDC_CLOCK_TOLERANCE: "${OIDC_CLOCK_TOLERANCE:-60}"
  OIDC_TOKEN_ENDPOINT_AUTH_METHOD: "${OIDC_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_basic}"
  OIDC_AUTO_PROVISION_DEFAULT_ROLE: "${OIDC_AUTO_PROVISION_DEFAULT_ROLE:-user}"
  OIDC_AUTO_PROVISION_DEFAULT_DEPARTMENT_ID: "${OIDC_AUTO_PROVISION_DEFAULT_DEPARTMENT_ID:-}"
  MFA_ENABLED: "${MFA_ENABLED:-true}"
  MFA_OPTIONAL_FOR_USERS: "${MFA_OPTIONAL_FOR_USERS:-true}"
  APP_MFA_REQUIRED_ROLES: "${APP_MFA_REQUIRED_ROLES:-admin,super_admin}"
  APP_MFA_REQUIRED_FOR_AUTH_METHODS: "${APP_MFA_REQUIRED_FOR_AUTH_METHODS:-local}"
  APP_MFA_REQUIRED_FOR_ADMIN_PANEL_AUTH_METHODS: "${APP_MFA_REQUIRED_FOR_ADMIN_PANEL_AUTH_METHODS:-local,sso}"
  APP_MFA_SESSION_TTL_MINUTES: "${APP_MFA_SESSION_TTL_MINUTES:-720}"
  DB_CONNECTION: mariadb
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
  DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
  DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
  SESSION_DRIVER: database
  SESSION_ENCRYPT: "${SESSION_ENCRYPT:-true}"
  SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
  SESSION_HTTP_ONLY: "${SESSION_HTTP_ONLY:-true}"
  SESSION_SAME_SITE: "${SESSION_SAME_SITE:-lax}"
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: "${DB_QUEUE_RETRY_AFTER:-180}"
  HEALTH_CACHE_STORE: "${HEALTH_CACHE_STORE:-database}"
  HEALTH_QUEUE_STALE_AFTER: "${HEALTH_QUEUE_STALE_AFTER:-300}"
  HEALTH_SCHEDULER_STALE_AFTER: "${HEALTH_SCHEDULER_STALE_AFTER:-300}"
  HEALTH_HEARTBEAT_TTL: "${HEALTH_HEARTBEAT_TTL:-600}"
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: "${MAIL_HOST:?MAIL_HOST is required}"
  MAIL_PORT: "${MAIL_PORT:?MAIL_PORT is required}"
  MAIL_USERNAME: "${MAIL_USERNAME:-}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
  MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-VisitorPortal}"
  GOTENBERG_URL: http://gotenberg:3000
  VISITOR_CONTACT_REQUIREMENT: "${VISITOR_CONTACT_REQUIREMENT:-optional}"
  PRIVACY_VISIT_RETENTION_DAYS: "${PRIVACY_VISIT_RETENTION_DAYS:-365}"
  PRIVACY_PURGE_ENABLED: "${PRIVACY_PURGE_ENABLED:-true}"
  PRIVACY_PURGE_CHUNK_SIZE: "${PRIVACY_PURGE_CHUNK_SIZE:-500}"
  PRIVACY_NOTIFICATION_RETENTION_DAYS: "${PRIVACY_NOTIFICATION_RETENTION_DAYS:-365}"
  PRIVACY_SEARCH_RATE_LIMIT_PER_MINUTE: "${PRIVACY_SEARCH_RATE_LIMIT_PER_MINUTE:-60}"
  PRIVACY_WALK_IN_CONFIDENTIAL_DEFAULT: "${PRIVACY_WALK_IN_CONFIDENTIAL_DEFAULT:-true}"
  PRIVACY_NOTICE_URL: "${PRIVACY_NOTICE_URL:-}"
  DATA_RETENTION_RUN_LOG_DAYS: "${DATA_RETENTION_RUN_LOG_DAYS:-1095}"
  BRANDING_MONITOR_AUTO_GENERATION: "${BRANDING_MONITOR_AUTO_GENERATION:-false}"
  BRANDING_MONITOR_DISPLAY_MODE: "${BRANDING_MONITOR_DISPLAY_MODE:-title_first_initial_last_name}"
  AUTO_MIGRATE: "false"
  AUTO_SEED: "false"
  FORCE_SEED: "false"

services:
  app:
    image: *app-image
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      <<: *app-environment
      RUN_SETUP: "true"
    volumes:
      - app_storage:/var/www/html/backend/storage
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  queue:
    image: *app-image
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600 --max-jobs=1000 --memory=128
    environment:
      <<: *app-environment
      RUN_SETUP: "false"
    volumes:
      - app_storage:/var/www/html/backend/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "visitorportal:health", "queue"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  scheduler:
    image: *app-image
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      <<: *app-environment
      RUN_SETUP: "false"
    volumes:
      - app_storage:/var/www/html/backend/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "visitorportal:health", "scheduler"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MARIADB_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  gotenberg:
    image: gotenberg/gotenberg:8.32.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--head", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  app_storage:
  dbdata:
