services:
  web:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    container_name: besucherportal-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - mailhog
    user: "${UID:-1000}:${GID:-1000}"

  queue:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    container_name: besucherportal-queue
    command: php artisan queue:work
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    user: "${UID:-1000}:${GID:-1000}"

  scheduler:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    container_name: besucherportal-scheduler
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    user: "${UID:-1000}:${GID:-1000}"

  db:
    image: mysql:8.0
    container_name: besucherportal-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: visitorportal
      MYSQL_USER: visitor
      MYSQL_PASSWORD: visitor_pw
      MYSQL_ROOT_PASSWORD: root_pw
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 10s
      timeout: 20s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    container_name: besucherportal-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  node:
    image: node:20-alpine
    container_name: besucherportal-node
    working_dir: /var/www/html/backend
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=false
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: besucherportal-gotenberg
    ports:
      - "3000:3000"

volumes:
  dbdata:
