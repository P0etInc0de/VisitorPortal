name: Documentation
description: Report missing, outdated, or unclear documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Documentation location
      description: Which document, section, or page is affected?
      placeholder: "Example: README.md, README.de.md, docs/operations.md, backend/.env.production.example"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, outdated, unclear, or wrong?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: What should be changed?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup
        - Deployment
        - Operations
        - Security
        - Privacy / Retention
        - SSO / MFA
        - Reception workflows
        - Welcome monitor
        - Badge / PDF
        - User guide
        - Developer documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Add screenshots if the documentation issue is about UI behavior or user-facing screens.
    validations:
      required: false
