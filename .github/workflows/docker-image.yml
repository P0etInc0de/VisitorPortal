name: Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/p0etinc0de/besucherportal
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: app
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create demo release package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PACKAGE_DIR="dist/VisitorPortal-demo-${TAG}"
          mkdir -p "$PACKAGE_DIR"

          cp docker-compose.demo.yml "$PACKAGE_DIR/"
          cp start.bat start.sh stop.bat stop.sh reset-demo.bat reset-demo.sh update.bat update.sh "$PACKAGE_DIR/"
          cp docs/setup.md "$PACKAGE_DIR/README.md"
          sed -i 's](release-artifacts.md)](docs/release-artifacts.md)]' "$PACKAGE_DIR/README.md"
          cp -R docs "$PACKAGE_DIR/docs"

          cat > "$PACKAGE_DIR/.env.demo.example" <<EOF
          VISITORPORTAL_VERSION=${TAG}
          EOF

          cd dist
          zip -r "VisitorPortal-demo-${TAG}.zip" "VisitorPortal-demo-${TAG}"

      - name: Create source release package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          mkdir -p dist/source
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C dist/source

          sed -i "s/RELEASE_VERSION_PLACEHOLDER/${TAG}/g" \
            dist/source/.env.demo.example

          (
            cd dist/source
            zip -qr "../besucherportal-${TAG}.zip" .
          )

          rm -rf dist/source

      - name: Create release draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DEMO="dist/VisitorPortal-demo-${TAG}.zip"
          SOURCE="dist/besucherportal-${TAG}.zip"

          test -s "$DEMO"
          test -s "$SOURCE"
          test -f "docs/releases/${TAG}.md"

          gh release create "$TAG" "$DEMO" "$SOURCE" \
            --verify-tag \
            --draft \
            --title "VisitorPortal ${TAG}" \
            --notes-file "docs/releases/${TAG}.md"